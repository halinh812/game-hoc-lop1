<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vở học Tiếng Anh của Bòng</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap">
<style>
  :root{
    --sky-top:#FFEFC9; --sky-mid:#DCEFC6; --sky-bottom:#EFF7E7;
    --canopy-far:#8FC48A; --canopy-near:#4E8F58; --canopy-deep:#2B5E3B;
    --trunk:#7A5636; --ground:#4B8A57; --ground-deep:#356B44;
    --ink:#233A2A; --ink-soft:rgba(35,58,42,.68);
    --glass:rgba(255,252,244,.92); --glass-border:rgba(255,255,255,.65);
    --gold:#F4A93B; --coral:#E4633F; --success:#2F8F5B; --star:#FFD25A;
    --shadow:rgba(20,40,25,.32); --page-bg:#E9E2CD;
    --locked-bg:rgba(255,255,255,.35);
    color-scheme: light;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--page-bg); color:var(--ink);
    font-family:'Be Vietnam Pro', system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; justify-content:center;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  img{ max-width:100%; }

  .stage{ width:min(430px,100%); min-height:100vh; position:relative; }
  .world{ position:relative; min-height:100vh; overflow:hidden; }

  /* Nền "rừng" ghép từ 3 lớp CỐ ĐỊNH theo mép màn hình (không dùng 1 SVG to
     kéo giãn theo tỉ lệ — với nội dung cao thấp khác nhau giữa các màn,
     cách đó khiến cây/mặt đất trôi vào giữa nội dung rất lộn xộn). Dùng cho
     mọi màn TRỪ màn chơi "Khu rừng kỳ bí" (xem .world-bg.forestphoto). */
  .world-bg{ position:absolute; inset:0; z-index:0; overflow:hidden;
    background:linear-gradient(180deg,#FFEFC9 0%, #DCEFC6 42%, #EFF7E7 100%); }
  /* .world-bg.forestphoto (ảnh nền riêng của Khu rừng kỳ bí) định nghĩa
     trong games/khu-rung-ky-bi/forest.css, không phải ở đây. */
  .sun-glow{
    position:absolute; top:16px; right:20px; width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,210,90,.95), rgba(255,210,90,0) 70%);
    animation: sunpulse 5s ease-in-out infinite;
  }
  .cloud{ position:absolute; background:#fff; border-radius:999px; }
  .cloud.c1{ width:64px; height:24px; top:64px; left:6%; opacity:.75; animation:driftx1 15s ease-in-out infinite; }
  .cloud.c2{ width:46px; height:18px; top:104px; right:16%; opacity:.6; animation:driftx2 19s ease-in-out infinite; }
  .canopy-band{ position:absolute; top:0; left:0; width:100%; height:88px; overflow:hidden; }
  .canopy-band svg{ position:absolute; top:0; left:0; width:100%; height:88px; display:block; }
  .ground-band{ position:absolute; bottom:0; left:0; width:100%; height:100px; overflow:hidden; }
  .ground-band svg{ position:absolute; bottom:0; left:0; width:100%; height:100px; display:block; }

  @keyframes sunpulse{ 0%,100%{ transform:scale(1); opacity:.9;} 50%{ transform:scale(1.07); opacity:1;} }
  @keyframes driftx1{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(10px);} }
  @keyframes driftx2{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(-8px);} }
  .blade{ transform-origin:bottom center; animation: sway 3s ease-in-out infinite alternate; }
  .blade:nth-child(3n){ animation-delay:-.6s; } .blade:nth-child(3n+1){ animation-delay:-1.3s; }
  @keyframes sway{ from{ transform:rotate(-4deg);} to{ transform:rotate(4deg);} }

  .content{ position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; padding:100px 16px 24px; }

  /* ---------- shared UI ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .topbar h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.3rem; color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.5); }
  .iconbtn{
    border:none; background:var(--glass); border:1px solid var(--glass-border); color:var(--ink);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; box-shadow:0 6px 14px rgba(20,40,25,.16);
  }
  .parentbtn{
    display:flex; align-items:center; gap:6px; justify-content:center; margin:14px auto 0; width:fit-content;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--ink); font-weight:700; font-size:.8rem;
    padding:9px 18px; border-radius:999px; cursor:pointer; box-shadow:0 6px 14px rgba(20,40,25,.22);
  }

  .chunkybtn{
    display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:16px;
    padding:14px 16px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.02rem; color:#fff;
    cursor:pointer; width:100%; box-shadow:0 5px 0 rgba(0,0,0,.18), 0 10px 18px rgba(20,40,25,.22);
    transition:transform .08s ease, box-shadow .08s ease; border-top:1px solid rgba(255,255,255,.35);
  }
  .chunkybtn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .chunkybtn:disabled{ opacity:.5; cursor:not-allowed; }
  .chunkybtn.coral{ background:linear-gradient(180deg,#F0805E,var(--coral)); }
  .chunkybtn.green{ background:linear-gradient(180deg,#57B36D,var(--success)); }
  .chunkybtn.gold{ background:linear-gradient(180deg,#F7C868,var(--gold)); }
  .ghostbtn{
    border:none; border-radius:16px; padding:12px 16px; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink); font-family:'Baloo 2', sans-serif; font-weight:700; cursor:pointer; width:100%;
    box-shadow:0 4px 10px rgba(20,40,25,.14);
  }

  .owl-wing{ transform-origin:top center; animation:wingwave 2.4s ease-in-out infinite; }
  .owl-blink{ animation:blink 4.5s ease-in-out infinite; transform-origin:center; }
  @keyframes wingwave{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-16deg);} }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1);} 96%{ transform:scaleY(.12);} }

  /* ---------- onboarding ---------- */
  .onboard-title{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.3rem; text-align:center; margin:6px 0 2px; }
  .onboard-sub{ text-align:center; color:var(--ink-soft); font-weight:600; font-size:.88rem; margin-bottom:14px; }
  .nameinput{
    width:100%; border-radius:14px; border:1px solid var(--glass-border); background:var(--glass);
    padding:13px 14px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.05rem; color:var(--ink);
    text-align:center; margin-bottom:16px; box-shadow:0 6px 14px rgba(20,40,25,.14);
  }
  .nameinput::placeholder{ color:var(--ink-soft); font-weight:600; }
  .avatargrid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;
    overflow-y:auto; padding:4px;
  }
  .avatarbtn{
    position:relative; border:3px solid transparent; background:var(--glass); border-radius:16px; padding:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 10px rgba(20,40,25,.14); transition:transform .1s ease, border-color .15s ease, background .15s ease;
    aspect-ratio:1;
  }
  .avatarbtn[aria-pressed="true"]{
    border-color:var(--coral); border-width:4px; background:#fff;
    transform:scale(1.12); box-shadow:0 8px 20px rgba(228,99,63,.55);
  }
  .avatarbtn[aria-pressed="true"]::after{
    content:'✓'; position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:14px; font-weight:800; line-height:24px; text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.3), 0 0 0 2px #fff;
  }
  .avatarbtn svg{ width:100%; height:100%; }

  /* ---------- home / game grid ---------- */
  .profilebar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .profilebar .avatarcircle{
    width:52px; height:52px; border-radius:50%; background:var(--glass); border:2px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(20,40,25,.18); flex:none;
    padding:4px;
  }
  .profilebar .greet{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.15rem; color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.5); }
  .profilebar .greet span{ display:block; font-family:'Be Vietnam Pro',sans-serif; font-weight:600; font-size:.76rem; color:var(--ink-soft); text-shadow:none; }
  /* "Sao" học tập — tổng LV mọi kỹ năng của mọi từ đã học (xem
     totalStars() trong engine/learning-engine.js), hiện đối diện tên bé. */
  .profilebar .starsbadge{
    margin-left:auto; flex:none; display:flex; align-items:center; gap:5px;
    background:var(--glass); border:1px solid var(--glass-border); border-radius:999px; padding:7px 12px;
    box-shadow:0 4px 10px rgba(20,40,25,.16);
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1rem; color:var(--ink);
  }

  .gamegrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  /* Cú mèo linh vật lấp khoảng trống phía dưới lưới trò chơi — trước đây
     là 1 mảng nền trống trải không có gì, nhìn "chết". */
  .homemascot{ flex:1; display:flex; align-items:center; justify-content:center; min-height:56px; }
  .homemascot svg{ animation:mascotFloat 3.4s ease-in-out infinite; }
  @keyframes mascotFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .gametile{
    border:none; border-radius:18px; padding:16px 10px; cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-border);
    box-shadow:0 4px 0 rgba(20,40,25,.14), 0 10px 18px rgba(20,40,25,.16);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .gametile:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(20,40,25,.14); }
  .gametile .emoji{ font-size:2.1rem; }
  .gametile .name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.86rem; color:var(--ink); line-height:1.25; }
  /* Icon riêng của ô từng game (vd .gametile.forest-tile/.foresttile-face,
     .gametile.farm-tile/.farmtile-face) định nghĩa trong games/<slug>/*.css
     của game đó. */
  /* Ô "Sắp ra mắt": trước là ổ khoá xám xịt chiếm hết sự chú ý (7/8 ô) —
     đổi sang linh vật ngủ gật be bé, màu pastel dịu, có nhịp thở nhẹ để
     đỡ trông "chết"/dở dang mà vẫn rõ ràng là chưa mở khoá. */
  .gametile.locked{ background:rgba(255,255,255,.4); box-shadow:none; cursor:default; }
  .gametile.locked .sleepy{ animation:sleepyBreathe 3.2s ease-in-out infinite; }
  .gametile.locked .name{ color:var(--ink-soft); font-size:.72rem; }
  .gametile.locked:active{ transform:none; }
  @keyframes sleepyBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }

  /* CSS của màn chơi + màn kết quả kiểu "bắt con vật" (starsrow, soundbtn,
     freeplay/freetile, tileswing, tileburst, summary-mid, starburst,
     fall...) dùng chung cho mọi game kiểu này — nằm ở
     engine/catch-game.css, không phải ở đây. */

  /* ---------- parent dashboard: clean, KHÔNG dùng phong cách thế giới game ---------- */
  .parentpage{ background:#FBFAF6; min-height:100vh; color:#233A2A; padding:20px 18px 30px; }
  .parentpage .pheader{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .parentpage .pheader button{
    border:none; background:#EFEBDD; color:#233A2A; width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .parentpage h1{ font-family:'Baloo 2', sans-serif; font-size:1.15rem; font-weight:800; }
  /* Bộ lọc "Bộ từ"/"Nhóm từ" phía trên bảng báo cáo: 2 nút dropdown — bấm
     vào mới hiện danh sách ô vuông tick bên trong (không chiếm chỗ cố
     định trên trang), tick nhiều ô cùng lúc trong 1 nhóm (multi-select). */
  .reportfilters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filterdd{ position:relative; }
  .filterddBtn{
    appearance:none; border:none; cursor:pointer; display:flex; align-items:center; gap:6px;
    background:#F4F1E6; border:1px solid #EAE5D5; border-radius:12px; padding:9px 12px;
    font-size:.82rem; font-weight:700; color:#233A2A; font-family:inherit;
  }
  .filterdd.ddopen .filterddBtn{ background:#E6F5EC; border-color:#bfe3cd; color:#1f6d43; }
  .fddCaret{ font-size:.65rem; color:#8B968E; transition:transform .15s ease; }
  .filterdd.ddopen .fddCaret{ transform:rotate(180deg); color:#1f6d43; }
  .fddBadge{
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px;
    border-radius:999px; background:#2f8f5b; color:#fff; font-size:.68rem; font-weight:800; padding:0 5px;
  }
  .filterddPanel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:20; min-width:220px; max-width:82vw;
    background:#fff; border:1px solid #EAE5D5; border-radius:12px; padding:8px;
    box-shadow:0 10px 24px rgba(20,40,25,.2);
    display:flex; flex-direction:column; gap:2px;
  }
  .filterddPanel[hidden]{ display:none; }
  .filterchip{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    border-radius:8px; padding:7px 6px; font-size:.82rem; font-weight:600; color:#233A2A;
  }
  .filterddPanel .filterchip:hover{ background:#F4F1E6; }
  .filterchip.checked{ color:#1f6d43; }
  .filterchip input{ position:absolute; opacity:0; width:0; height:0; }
  .filterchip .fbox{
    width:16px; height:16px; border-radius:4px; border:1.5px solid #B9C2B4; background:#fff;
    flex:none; display:flex; align-items:center; justify-content:center;
  }
  .filterchip.checked .fbox{ background:#2f8f5b; border-color:#2f8f5b; }
  .filterchip.checked .fbox::after{ content:''; width:8px; height:8px; border-radius:1px; background:#fff; }
  .skillhead{ display:grid; grid-template-columns:2.1fr repeat(5,1fr); gap:4px; padding:0 4px 8px; font-size:.62rem; font-weight:700; color:#6B7A70; text-transform:uppercase; letter-spacing:.02em; text-align:center; }
  .skillhead span:first-child{ text-align:left; }
  .wordrow{
    display:grid; grid-template-columns:2.1fr repeat(5,1fr); gap:4px; align-items:center;
    background:#fff; border:1px solid #EAE5D5; border-radius:12px; padding:9px 6px; margin-bottom:8px;
  }
  .wordrow .wname{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:.78rem; min-width:0; }
  .wordrow .wname img{ width:24px; height:24px; object-fit:contain; flex:none; }
  .wordrow .wname span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lvpill{
    margin:0 auto; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.78rem; font-variant-numeric:tabular-nums; color:#fff;
  }
  .emptystate{ text-align:center; color:#8B968E; font-size:.86rem; padding:40px 10px; line-height:1.6; }

  /* Phần "Thêm/sửa từ vựng" trong Trang phụ huynh — chỉ tự hiện ra (nút +
     trong pheader) khi trang này đang được mở qua server quản trị local
     (npm start), vì lúc đó mới có API /api/* để ghi file. Trên GitHub
     Pages (web tĩnh, không server) không có gì thêm ở đây cả — xem
     tryMountContentManager() trong app.js. Trước đây mục này nằm thẳng
     ở cuối trang khiến trang dài/rối — giờ gói vào 1 bảng (modal) trượt
     lên từ đáy màn hình, ẩn/hiện qua nút tròn "+". */
  .parentpage .pheader .cmFabBtn{ margin-left:auto; background:#2f8f5b; color:#fff; font-size:1.3rem; font-weight:700; }
  .cmOverlay{
    position:fixed; inset:0; z-index:50; background:rgba(20,35,25,.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .cmOverlay[hidden]{ display:none; }
  .cmModal{
    width:100%; max-width:430px; max-height:88vh; overflow-y:auto;
    background:#FBFAF6; border-radius:20px 20px 0 0; padding:16px 18px 22px;
    box-shadow:0 -8px 28px rgba(20,40,25,.28);
  }
  .cmModalHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cmModalHead h2{ font-family:'Baloo 2', sans-serif; font-size:1.05rem; font-weight:800; margin:0; }
  .cmCloseBtn{
    border:none; background:#EFEBDD; color:#233A2A; width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; font-size:.95rem;
  }
  .contentmgr label{ display:block; font-size:.75rem; font-weight:700; color:#6B7A70; margin:12px 0 4px; }
  .contentmgr label:first-of-type{ margin-top:0; }
  .contentmgr select, .contentmgr input[type=text]{
    width:100%; padding:8px 10px; border:1px solid #EAE5D5; border-radius:8px; font-size:.88rem; background:#fff; color:#233A2A;
  }
  .contentmgr input[type=file]{ width:100%; font-size:.78rem; padding:5px 0; }
  .contentmgr .row2{ display:flex; gap:10px; }
  .contentmgr .row2 > div{ flex:1; }
  .contentmgr .preview{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .contentmgr .preview img, .contentmgr .preview video{ width:64px; height:64px; object-fit:contain; background:#F4F1E6; border-radius:8px; border:1px solid #EAE5D5; }
  .contentmgr .preview .empty{ font-size:.7rem; color:#8B968E; align-self:center; }
  .contentmgr .badge{ display:inline-block; font-size:.68rem; background:#F4F1E6; color:#6B7A70; padding:2px 7px; border-radius:999px; margin-left:4px; }
  .contentmgr .hint{ font-size:.72rem; color:#8B968E; margin:4px 0 0; line-height:1.4; }
  .contentmgr .cmBtnRow{ display:flex; gap:10px; margin-top:18px; }
  .contentmgr button{ appearance:none; border:none; border-radius:12px; padding:11px 16px; font-size:.86rem; font-weight:700; cursor:pointer; }
  .contentmgr .cmBtnRow button{ flex:1; }
  .contentmgr button.savebtn{ color:#fff; background:#2f8f5b; }
  .contentmgr button.savebtn:disabled{ background:#a9b8ac; }
  .contentmgr button.pubbtn{ color:#233A2A; background:#EFEBDD; border:1px solid #EAE5D5; }
  .contentmgr .msg{ margin-top:10px; padding:8px 10px; border-radius:8px; font-size:.78rem; white-space:pre-wrap; line-height:1.5; }
  .contentmgr .msg.ok{ background:#E6F5EC; color:#1f6d43; }
  .contentmgr .msg.err{ background:#FBECEB; color:#B24A43; }
  .contentmgr .msg.info{ background:#EEF3FB; color:#33507a; }
  .contentmgr pre.log{ background:#233A2A; color:#DCEFE0; font-size:.72rem; padding:10px; border-radius:8px; margin-top:10px; max-height:160px; overflow:auto; white-space:pre-wrap; }

  @media (prefers-reduced-motion: reduce){
    .sun-glow,.cloud,.blade,.owl-wing,.owl-blink,.sleepy,.homemascot svg{ animation:none !important; }
  }
  button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
</style>
<!-- CSS dùng chung cho cơ chế "bắt con vật" (mọi game kiểu nghe tên +
     bấm đúng con vật dùng lại) -->
<link rel="stylesheet" href="engine/catch-game.css">
<!-- CSS riêng của từng game — mỗi game 1 file, xem games/<slug>/*.css -->
<link rel="stylesheet" href="games/khu-rung-ky-bi/forest.css">
<link rel="stylesheet" href="games/nong-trai-cua-be/farm.css">
<link rel="stylesheet" href="games/bill/bill.css">
<link rel="stylesheet" href="games/how-many/howmany.css">
</head>
<body>

<div class="stage">
  <div class="world" id="root"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
